[pytest]
# Default timeout for all tests. Spark local mode starts in ~10s on a laptop;
# 120s is generous for unit tests. Integration tests can override with @pytest.mark.timeout.
timeout = 120

# Show local variable values on failure — helpful for debugging schema mismatches
showlocals = true

# Suppress noisy Spark/Java log output during test runs
log_cli = false
log_level = WARNING

# Discover tests in spark/ and producer/ as well as tests/
testpaths = tests spark producer
